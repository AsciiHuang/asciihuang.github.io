<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beans - 最高分</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-other">
  <div class="page-container">
    <div class="page-header">
      <button class="back-btn" onclick="location.href='index.html'">← 返回</button>
      <span class="page-title">最高分</span>
    </div>

    <div class="score-card">
      <div class="score-row">
        <span class="score-label">😌 簡單模式</span>
        <span class="score-value" id="easy-score">0</span>
      </div>
      <div class="score-row">
        <span class="score-label">😤 困難模式</span>
        <span class="score-value" id="hard-score">0</span>
      </div>
    </div>
  </div>

  <script>
    const get = (k, d) => { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); };
    document.getElementById('easy-score').textContent = get('BeansSettingEasyModeScore', 0);
    document.getElementById('hard-score').textContent = get('BeansSettingHardModeScore', 0);
  </script>
</body>
</html>
