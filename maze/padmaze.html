<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maze</title>
  <link rel="stylesheet" href="maze-style.css">
  <style>
    #tilt-start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #tilt-start-btn {
      padding: 16px 40px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #c8600a, #e8882a);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(200,96,10,0.4);
    }
    #tilt-start-btn:active { transform: scale(0.94); }
  </style>
</head>
<body>

  <div id="topbar">
    <div class="topbar-left">
      <button class="top-btn" onclick="location.href='index.html'">返回首頁</button>
      <button class="top-btn" id="btn-regenerate">重新產生</button>
    </div>
    <div class="topbar-right">
      <button class="top-btn" id="btn-hint1">提示</button>
      <button class="top-btn" id="btn-hint2">進階提示</button>
      <button class="top-btn" id="btn-answer">答案</button>
    </div>
  </div>

  <div id="maze-container">
    <div class="loading" id="loading">產生迷宮中...</div>
  </div>

  <script src="maze-core.js"></script>
  <script>
    // ===== Wake Lock (keep screen on) =====
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (e) {}
    }
    requestWakeLock();
    // Re-acquire wake lock when page becomes visible again
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    // ===== Tilt control =====
    let tiltBeta = 0;
    let tiltGamma = 0;
    let tiltAccX = 0;
    let tiltAccY = 0;
    let tiltRAF = null;

    let needsPermission = typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function';

    function startTiltControl() {
      if (needsPermission) {
        // iOS/iPadOS: show overlay button, request permission on user gesture
        showStartOverlay();
      } else {
        // Android / desktop: start directly
        initTiltListener();
      }
    }

    function showStartOverlay() {
      const overlay = document.createElement('div');
      overlay.id = 'tilt-start-overlay';
      overlay.innerHTML = `
        <button id="tilt-start-btn">點擊開始遊戲</button>
      `;
      document.body.appendChild(overlay);

      document.getElementById('tilt-start-btn').addEventListener('click', () => {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            overlay.remove();
            initTiltListener();
          }
        }).catch(() => {
          overlay.remove();
        });
      });
    }

    function initTiltListener() {
      window.addEventListener('deviceorientation', (e) => {
        tiltBeta = e.beta || 0;
        tiltGamma = e.gamma || 0;
      });
      tiltLoop();
    }

    function tiltLoop() {
      if (!currentMaze || path.length === 0) {
        tiltRAF = requestAnimationFrame(tiltLoop);
        return;
      }

      const deadZone = 5;
      const maxTilt = 35;

      // Ease-in curve: slow at small tilts, accelerates at larger tilts
      let tx = 0, ty = 0;
      if (Math.abs(tiltGamma) > deadZone) {
        const t = Math.min(1, (Math.abs(tiltGamma) - deadZone) / (maxTilt - deadZone));
        tx = Math.sign(tiltGamma) * t * t; // quadratic ease-in
      }
      if (Math.abs(tiltBeta) > deadZone) {
        const t = Math.min(1, (Math.abs(tiltBeta) - deadZone) / (maxTilt - deadZone));
        ty = Math.sign(tiltBeta) * t * t;
      }

      const speed = 0.25;
      tiltAccX += tx * speed;
      tiltAccY += ty * speed;

      while (Math.abs(tiltAccX) >= 1 || Math.abs(tiltAccY) >= 1) {
        const cur = path[path.length - 1];
        let moved = false;

        if (Math.abs(tiltAccX) >= Math.abs(tiltAccY) && Math.abs(tiltAccX) >= 1) {
          const dx = Math.sign(tiltAccX);
          const nx = cur.x + dx;
          const ny = cur.y;
          if (nx >= 0 && nx < COLS && canPass(cur.x, cur.y, nx, ny)) {
            if (path.length >= 2 && path[path.length - 2].x === nx && path[path.length - 2].y === ny) {
              path.pop();
            } else {
              path.push({ x: nx, y: ny });
            }
            moved = true;
          }
          tiltAccX -= dx;
        } else if (Math.abs(tiltAccY) >= 1) {
          const dy = Math.sign(tiltAccY);
          const nx = cur.x;
          const ny = cur.y + dy;
          if (ny >= 0 && ny < ROWS && canPass(cur.x, cur.y, nx, ny)) {
            if (path.length >= 2 && path[path.length - 2].x === nx && path[path.length - 2].y === ny) {
              path.pop();
            } else {
              path.push({ x: nx, y: ny });
            }
            moved = true;
          }
          tiltAccY -= dy;
        } else {
          break;
        }

        if (moved) {
          drawPath();
          const last = path[path.length - 1];
          if (last.x === endCell.x && last.y === endCell.y) {
            showWin();
            tiltAccX = 0;
            tiltAccY = 0;
            return;
          }
        } else {
          if (Math.abs(tiltAccX) >= 1) tiltAccX = 0;
          if (Math.abs(tiltAccY) >= 1) tiltAccY = 0;
          break;
        }
      }

      tiltRAF = requestAnimationFrame(tiltLoop);
    }

    function setupTiltHandlers() {
      pathCanvas.style.cursor = 'default';
      startTiltControl();
    }

    window._mazeOnReady = setupTiltHandlers;
    run(setupTiltHandlers);
  </script>

  <div id="win-overlay" onclick="this.classList.remove('show')">
    <div id="win-card" onclick="event.stopPropagation()">
      <div class="win-crown">👑</div>
      <div class="win-text">恭喜過關</div>
      <button class="win-btn" onclick="document.getElementById('win-overlay').classList.remove('show')">確定</button>
    </div>
  </div>
</body>
</html>
